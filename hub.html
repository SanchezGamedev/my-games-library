<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Game Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4CAF50; }
        
        /* Вкладки */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { background-color: #1e1e1e; color: #fff; border: 2px solid #333; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-size: 16px; transition: 0.2s; }
        .tab-btn:hover { border-color: #4CAF50; }
        .tab-btn.active { background-color: #4CAF50; border-color: #4CAF50; font-weight: bold; }
        
        /* Контент */
        .tab-content { display: none; max-width: 900px; margin: 0 auto; }
        .tab-content.active { display: block; }
        
        /* Карточки */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; border-left: 5px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .card.hot { border-left-color: #ff5722; }
        .card.match { border-left-color: #2196F3; }
        
        .card h3 { margin: 0 0 10px 0; font-size: 18px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .badge.fire { background-color: #ff5722; color: #fff; }
        .badge.store { background-color: #333; color: #aaa; border: 1px solid #555; }
        .price { font-size: 20px; font-weight: bold; color: #4CAF50; margin-bottom: 15px; }
        .buy-btn { text-decoration: none; background: #4CAF50; color: #fff; text-align: center; padding: 8px; border-radius: 5px; font-weight: bold; }
        .buy-btn:hover { background: #45a049; }
    </style>
</head>
<body>

    <h1>🎮 Personal Game Hub</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('library')">📚 Библиотека</button>
        <button class="tab-btn" onclick="switchTab('deals')">🏷️ Скидки</button>
        <button class="tab-btn" onclick="switchTab('recommendations')">🎯 Рекомендации</button>
    </div>

    <!-- Вкладка: Библиотека -->
    <div id="library" class="tab-content active">
        <h2>Игры в Playnite</h2>
        <div id="lib-grid" class="grid">Загрузка данных...</div>
    </div>

    <!-- Вкладка: Скидки -->
    <div id="deals" class="tab-content">
        <h2>Скидки из Вишлиста</h2>
        <div id="deals-grid" class="grid">Загрузка данных...</div>
    </div>

    <!-- Вкладка: Рекомендации -->
    <div id="recommendations" class="tab-content">
        <h2>Что купить или поиграть</h2>
        <div id="rec-grid" class="grid">Загрузка данных...</div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function loadHubData() {
            try {
                // Загружаем сгенерированные бэкендом данные
                const hubRes = await fetch('data/generated_hub.json');
                if (hubRes.ok) {
                    const data = await hubRes.json();
                    
                    // Рендер скидок
                    const dealsHtml = data.deals.map(d => `
                        <div class="card hot">
                            <h3>${d.name}</h3>
                            <div>
                                ${d.is_historical_low ? '<span class="badge fire">🔥 Исторический минимум</span>' : ''}
                                <span class="badge store">${d.store}</span>
                            </div>
                            <div class="price">${d.price}</div>
                            ${d.link ? `<a href="${d.link}" class="buy-btn" target="_blank">Перейти в магазин</a>` : ''}
                        </div>
                    `).join('');
                    document.getElementById('deals-grid').innerHTML = dealsHtml || '<p>На данный момент скидок нет.</p>';

                    // Рендер рекомендаций
                    const recHtml = data.recommendations.map(r => `
                        <div class="card match">
                            <h3>${r.name}</h3>
                            <div class="price" style="color: #2196F3;">Match: ${r.match_score}%</div>
                            <p style="font-size: 14px; color: #aaa;"><b>Похоже на:</b><br>${r.similar_to.join('<br>')}</p>
                        </div>
                    `).join('');
                    document.getElementById('rec-grid').innerHTML = recHtml || '<p>Недостаточно данных для рекомендаций.</p>';
                }

                // Загружаем библиотеку
                const libRes = await fetch('games.json');
                if (libRes.ok) {
                    const libData = await libRes.json();
                    // Показываем последние 50 добавленных/измененных игр для оптимизации
                    const libHtml = libData.slice(0, 50).map(g => `
                        <div class="card">
                            <h3>${g.Name}</h3>
                            <p style="font-size: 14px; color: #aaa;">
                                Оценка: <b style="color: #fff;">${g.UserScore || 'Нет'}</b><br>
                                Время: <b style="color: #fff;">${Math.floor((g.Playtime || 0) / 3600)} ч.</b>
                            </p>
                        </div>
                    `).join('');
                    document.getElementById('lib-grid').innerHTML = libHtml + (libData.length > 50 ? '<p><i>Показаны первые 50 игр...</i></p>' : '');
                }

            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.querySelectorAll('.grid').forEach(el => el.innerHTML = '<p>Данные еще не сгенерированы бэкендом. Дождитесь выполнения GitHub Actions.</p>');
            }
        }

        loadHubData();
    </script>
</body>
</html>
