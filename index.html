<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Игры</title>
    <style>
        /* Ограничили максимальную ширину и выровняли по центру (margin: 0 auto) */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #ffffff; padding: 20px; margin: 0 auto; max-width: 960px; }
        
        /* Панель управления */
        .controls-container { position: sticky; top: 0; background: #121212; padding: 10px 0 15px 0; z-index: 10; border-bottom: 1px solid #333; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .search-input { width: 100%; padding: 15px; font-size: 16px; border-radius: 10px; border: none; outline: none; background: #2c2c2c; color: #fff; box-sizing: border-box; }
        
        .filters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sort-select { width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: none; outline: none; background: #2c2c2c; color: #fff; box-sizing: border-box; }
        
        /* Статистика */
        .stats { font-size: 14px; color: #888; margin-bottom: 15px; font-weight: bold; }
        .stats-highlight { color: #4ade80; }

        /* Карточка игры */
        .game-card { display: flex; align-items: flex-start; gap: 15px; background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 4px solid #0078D7; }
        
        .game-number { font-size: 18px; font-weight: bold; color: #555; min-width: 30px; margin-top: -2px; }
        
        /* Блок вертикальной капсулы (немного увеличили для ПК) */
        .game-cover { flex-shrink: 0; }
        .game-cover img { 
            width: 90px; 
            height: 135px; 
            border-radius: 6px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
            object-fit: cover; 
            background: #2c2c2c; 
        }
        
        .game-content { flex: 1; min-width: 0; }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; line-height: 1.2; }
        
        /* Теги метаданных */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; color: #aaaaaa; }
        .meta-item span { color: #ffffff; font-weight: 500; }
        
        .badges { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-installed { background: #1a472a; color: #4ade80; }
        .badge-status { background: #374151; color: #d1d5db; }
        .badge-series { background: #4c1d95; color: #c4b5fd; }

        /* Адаптация под телефоны */
        @media (max-width: 500px) {
            .meta-grid { grid-template-columns: 1fr; }
            .filters-row { grid-template-columns: 1fr; }
            /* Увеличили картинки для мобильных устройств (было 60х90) */
            .game-cover img { width: 76px; height: 114px; }
            .game-card { padding: 12px; gap: 12px; }
            .game-number { font-size: 14px; min-width: 20px; }
            .game-title { font-size: 16px; margin-bottom: 5px; }
        }
    </style>
</head>
<body>
    <div class="controls-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Найти игру...">
        
        <select id="sortSelect" class="sort-select">
            <option value="name_asc">Сортировка: По алфавиту (А-Я)</option>
            <option value="name_desc">Сортировка: По алфавиту (Я-А)</option>
            <option value="size_desc">Сортировка: Сначала большие по размеру</option>
            <option value="size_asc">Сортировка: Сначала маленькие по размеру</option>
            <option value="install_desc">Сортировка: Сначала установленные</option>
            <option value="status_asc">Сортировка: По статусу прохождения</option>
        </select>

        <div class="filters-row">
            <select id="filterInstall" class="sort-select">
                <option value="all">Показать: Все</option>
                <option value="installed">Только установленные</option>
                <option value="not_installed">Не установленные</option>
            </select>
            <select id="filterStatus" class="sort-select">
                <option value="all">Статус: Любой</option>
            </select>
        </div>
    </div>
    
    <div class="stats" id="stats">Загрузка...</div>
    <div id="results">Загрузка библиотеки...</div>

    <script>
        let games = [];

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return 'Неизвестно';
            const k = 1024;
            const sizes = ['Б', 'КБ', 'МБ', 'ГБ', 'ТБ'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getNormalizedName(name) {
            if (!name) return "";
            return name.toLowerCase().replace(/\([^)]*\)/g, '').replace(/\[[^\]]*\]/g, '').replace(/[^a-zа-я0-9]/gi, '');
        }

        function getCoverUrl(game) {
            if (game.SteamId) {
                return `https://cdn.cloudflare.steamstatic.com/steam/apps/${game.SteamId}/library_600x900.jpg`;
            }
            const shortName = encodeURIComponent(game.Name.substring(0, 15));
            return `https://placehold.co/120x180/2c2c2c/888888?text=${shortName}`;
        }

        fetch('games.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                games = data;
                populateStatusFilter(games);
                updateView();
            })
            .catch(err => document.getElementById('results').innerHTML = 'Ошибка загрузки данных');

        function populateStatusFilter(list) {
            const statusSelect = document.getElementById('filterStatus');
            const uniqueStatuses = [...new Set(list.map(g => g.CompletionStatus).filter(s => s))].sort();
            
            uniqueStatuses.forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                option.textContent = `Статус: ${status}`;
                statusSelect.appendChild(option);
            });
        }

        document.getElementById('searchInput').addEventListener('input', updateView);
        document.getElementById('sortSelect').addEventListener('change', updateView);
        document.getElementById('filterInstall').addEventListener('change', updateView);
        document.getElementById('filterStatus').addEventListener('change', updateView);

        function updateView() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortMethod = document.getElementById('sortSelect').value;
            const filterInstall = document.getElementById('filterInstall').value;
            const filterStatus = document.getElementById('filterStatus').value;

            let filteredGames = games.filter(g => {
                const matchSearch = g.Name.toLowerCase().includes(query);
                const matchInstall = filterInstall === 'all' || 
                                     (filterInstall === 'installed' && g.IsInstalled) || 
                                     (filterInstall === 'not_installed' && !g.IsInstalled);
                const matchStatus = filterStatus === 'all' || g.CompletionStatus === filterStatus;
                return matchSearch && matchInstall && matchStatus;
            });
            
            filteredGames.sort((a, b) => {
                if (sortMethod === 'name_asc') return a.Name.localeCompare(b.Name);
                if (sortMethod === 'name_desc') return b.Name.localeCompare(a.Name);
                if (sortMethod === 'size_desc') return (b.InstallSize || 0) - (a.InstallSize || 0);
                if (sortMethod === 'size_asc') return (a.InstallSize || 0) - (b.InstallSize || 0);
                if (sortMethod === 'install_desc') return (b.IsInstalled === true ? 1 : 0) - (a.IsInstalled === true ? 1 : 0);
                if (sortMethod === 'status_asc') return (a.CompletionStatus || '').localeCompare(b.CompletionStatus || '');
                return 0;
            });

            const uniqueFiltered = new Set(filteredGames.map(g => getNormalizedName(g.Name))).size;
            const uniqueTotal = new Set(games.map(g => getNormalizedName(g.Name))).size;

            document.getElementById('stats').innerHTML = 
                `Найдено: ${filteredGames.length} <span class="stats-highlight">(уникальных: ${uniqueFiltered})</span> ` + 
                `из ${games.length} <span class="stats-highlight">(всего уникальных: ${uniqueTotal})</span>`;

            renderGames(filteredGames);
        }

        function renderGames(list) {
            if (list.length === 0) {
                document.getElementById('results').innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Ничего не найдено</div>';
                return;
            }
            
            const html = list.map((g, index) => `
                <div class="game-card">
                    <div class="game-number">${index + 1}</div>
                    
                    <div class="game-cover">
                        <img src="${getCoverUrl(g)}" alt="Cover" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/120x180/2c2c2c/888888?text=No+Cover';">
                    </div>

                    <div class="game-content">
                        <div class="game-title">${g.Name}</div>
                        
                        <div class="meta-grid">
                            <div class="meta-item">Библиотека: <span>${g.Source || 'Ручная установка'}</span></div>
                            <div class="meta-item">Платформа: <span>${g.Platform || 'PC'}</span></div>
                            <div class="meta-item">Разраб: <span>${g.Developer || '—'}</span></div>
                            <div class="meta-item">Издатель: <span>${g.Publisher || '—'}</span></div>
                            <div class="meta-item" style="grid-column: span 2;">Размер: <span>${formatBytes(g.InstallSize)}</span></div>
                        </div>

                        <div class="badges">
                            ${g.IsInstalled ? '<span class="badge badge-installed">Установлена</span>' : ''}
                            ${g.CompletionStatus ? `<span class="badge badge-status">${g.CompletionStatus}</span>` : ''}
                            ${g.Series ? `<span class="badge badge-series">${g.Series}</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>
</html>
