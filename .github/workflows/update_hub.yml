name: Update Game Hub Data

on:
  schedule:
    - cron: '0 */8 * * *' # Запуск каждые 8 часов
  workflow_dispatch:      # Кнопка для ручного запуска
  push:
    paths:
      - 'games.json'      # Запуск при экспорте из Playnite
    branches:
      - main

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Права на запись файлов обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Main Orchestrator
        env:
          # Проброс секретов в переменные окружения
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python scripts/main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_hub.json data/notified_deals.json
          # Коммитим только если есть изменения
          git diff --quiet && git diff --staged --quiet || (git commit -m "Авто-обновление данных хаба" && git push)